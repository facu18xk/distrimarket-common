    put:
      tags: [Personas]
      summary: Actualizar datos de persona
      operationId: updatePersona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaRequestDTO'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaResponseDTO'
    delete:
      tags: [Personas]
      summary: Eliminar persona
      operationId: deletePersona
      responses:
        '204':
          description: Persona eliminada con éxito

  /inventario/empleados:
    get:
      tags: [Empleados]
      summary: Listar empleados
      operationId: listarEmpleados
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/FilterCargoQuery'
        - $ref: '#/components/parameters/FilterEstadoQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoPageResponseDTO'
    post:
      tags: [Empleados]
      summary: Registrar empleado
      operationId: crearEmpleado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoRequestDTO'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoResponseDTO'

  /inventario/empleados/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Empleados]
      summary: Obtener empleado por ID
      operationId: obtenerEmpleadoPorId
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoResponseDTO'
    put:
      tags: [Empleados]
      summary: Actualizar empleado
      operationId: updateEmpleado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoRequestDTO'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoResponseDTO'
    delete:
      tags: [Empleados]
      summary: Eliminar empleado
      operationId: deleteEmpleado
      responses:
        '204':
          description: Empleado eliminado con éxito

  /inventario/ajustes-stock:
    get:
      tags: [Ajustes-Stock]
      summary: Historial de ajustes de stock
      operationId: listarAjustesStock
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/FilterDepositoQuery'
        - $ref: '#/components/parameters/FilterEmpleadoQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjusteStockPageResponseDTO'
    post:
      tags: [Ajustes-Stock]
      summary: Registrar y procesar ajuste de stock
      operationId: crearAjusteStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteStockRequestDTO'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjusteStockResponseDTO'

  /inventario/ajustes-stock/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Ajustes-Stock]
      summary: Detalle de ajuste de stock por ID
      operationId: obtenerAjusteStockPorId
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjusteStockResponseDTO'

  /inventario/transferencias-stock:
    get:
      tags: [Transferencias-Stock]
      summary: Historial de transferencias
      operationId: listarTransferenciaStock
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/FilterDepositoOrigenQuery'
        - $ref: '#/components/parameters/FilterDepositoDestinoQuery'
        - $ref: '#/components/parameters/FilterEmpleadoQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferenciaStockPageResponseDTO'
    post:
      tags: [Transferencias-Stock]
      summary: Procesar y registrar transferencia de stock
      operationId: crearTransferenciaStock
      requestBody:
        required: true
        content:
          application/json:
