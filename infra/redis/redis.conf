# Configuración de Redis para Distrimarket (usada por docker-compose.yml).

# Dentro del contenedor escucha en todas las interfaces; el acceso lo limita el puerto publicado.
bind 0.0.0.0
port 6379
# Desactivado para que los demás microservicios del grupo puedan conectarse.
# Si Redis se comparte por la red, definir REDIS_PASSWORD (ver docker-compose.yml).
protected-mode no

# Memoria máxima para la caché.
maxmemory 256mb
# Política de retención: si falta memoria, solo se desalojan claves CON TTL (las menos usadas).
# Las claves sin TTL (dominios "persistentes", por ejemplo medio-pago o rol) nunca se desalojan;
# solo se reemplazan o se borran cuando el microservicio cambia el dato.
maxmemory-policy volatile-lru

# Guarda la caché en disco para que sobreviva a un reinicio del contenedor.
appendonly yes
appendfsync everysec

# Registro de comandos lentos (más de 10 ms) para diagnóstico.
slowlog-log-slower-than 10000
slowlog-max-len 128
