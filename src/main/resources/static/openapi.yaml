          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDepositoResponseDTO'
    put:
      tags: [Stocks]
      summary: Actualizar cantidad de stock
      operationId: updateStockDeposito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockDepositoRequestDTO'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDepositoResponseDTO'
    delete:
      tags: [Stocks]
      summary: Eliminar registro de stock
      operationId: deleteStockDeposito
