openapi: 3.0.3
info:
  title: DistriMarket API - Módulo Inventarios
  description: Contrato API y DTOs optimizados para Productos, Marcas, Categorías, Depósitos, Ajustes de Stock y Transferencias de Stock.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor Local de Desarrollo

# =============================================================
# 1. TAGS GLOBALES
# =============================================================
tags:
  - name: Categorias
    description: Endpoints para la gestión de categorías de productos.
  - name: Marcas
    description: Endpoints para la gestión de marcas de productos.
  - name: Productos
    description: Endpoints para la gestión de productos.
  - name: Depositos
    description: Endpoints para la gestión de depósitos de productos.
  - name: Stocks
    description: Endpoints para la gestión de stock en los depósitos de productos.
  - name: Personas
    description: Endpoints para la gestión de personas.
  - name: Empleados
    description: Endpoints para la gestión de empleados.
  - name: Ajustes-Stock
    description: Endpoints para correcciones de stock por mermas, vencimientos o sobrantes físicos.
  - name: Transferencias-Stock
    description: Movimientos de mercadería entre depósitos centrales y sucursales.

# =============================================================
# 2. PATHS (RUTAS RESTful)
# =============================================================
paths:
  # -----------------------------------------------------------
  # PATHS - CATEGORÍAS
  # -----------------------------------------------------------
  /categorias:
    get:
      tags: [Categorias]
      summary: Obtener lista paginada de categorías
      operationId: listarCategorias
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortByQuery'
        - $ref: '#/components/parameters/SortDirQuery'
      responses:
        '200':
          description: Lista paginada obtenida con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaPageResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    post:
      tags: [Categorias]
      summary: Crear una nueva categoría
      operationId: crearCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequestDTO'
      responses:
        '201':
          description: Categoría creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /categorias/{idCategoria}:
    get:
      tags: [Categorias]
      summary: Obtener categoría por ID
      operationId: obtenerCategoriaPorId
      parameters:
        - name: idCategoria
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    put:
      tags: [Categorias]
      summary: Actualizar una categoría existente
      operationId: updateCategoria
      parameters:
        - name: idCategoria
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequestDTO'
      responses:
        '200':
          description: Categoría actualizada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    delete:
      tags: [Categorias]
      summary: Eliminar categoría por ID
      operationId: deleteCategoria
      parameters:
        - name: idCategoria
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Categoría eliminada con éxito
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  # -----------------------------------------------------------
  # PATHS - MARCAS
  # -----------------------------------------------------------
  /marcas:
    get:
      tags: [Marcas]
      summary: Obtener lista paginada de marcas
      operationId: listarMarcas
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortByQuery'
        - $ref: '#/components/parameters/SortDirQuery'
      responses:
        '200':
          description: Lista paginada obtenida con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcaPageResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    post:
      tags: [Marcas]
      summary: Crear una nueva marca
      operationId: crearMarca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaRequestDTO'
      responses:
        '201':
          description: Marca creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /marcas/{idMarca}:
    get:
      tags: [Marcas]
      summary: Obtener marca por ID
      operationId: obtenerMarcaPorId
      parameters:
        - name: idMarca
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Marca encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    put:
      tags: [Marcas]
      summary: Actualizar una marca existente
      operationId: updateMarca
      parameters:
        - name: idMarca
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaRequestDTO'
      responses:
        '200':
          description: Marca actualizada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    delete:
      tags: [Marcas]
      summary: Eliminar marca por ID
      operationId: deleteMarca
      parameters:
        - name: idMarca
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Marca eliminada con éxito
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  # -----------------------------------------------------------
  # PATHS - PRODUCTOS
  # -----------------------------------------------------------
  /productos:
    get:
      tags: [Productos]
      summary: Listar productos con paginación y filtros
      operationId: listarProductos
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/FilterNombreQuery'
        - $ref: '#/components/parameters/FilterCategoriaQuery'
        - $ref: '#/components/parameters/FilterMarcaQuery'
        - $ref: '#/components/parameters/FilterEstadoQuery'
      responses:
        '200':
          description: Catálogo paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPageResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

    post:
      tags: [Productos]
      summary: Crear un nuevo producto
      operationId: crearProducto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequestDTO'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /productos/{idProducto}:
    get:
      tags: [Productos]
      summary: Detalle de producto por ID
      operationId: obtenerProductoPorId
      parameters:
        - name: idProducto
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ficha del producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponseDTO'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    put:
      tags: [Productos]
      summary: Actualizar un producto existente
      operationId: updateProducto
      parameters:
        - name: idProducto
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequestDTO'
      responses:
        '200':
          description: Producto actualizado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponseDTO'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    delete:
      tags: [Productos]
      summary: Eliminar producto por ID
      operationId: deleteProducto
      parameters:
        - name: idProducto
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Producto eliminado con éxito
        '404':
