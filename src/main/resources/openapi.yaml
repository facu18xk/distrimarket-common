          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Empleado eliminado correctamente
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # -----------------------------------------------------------
  # PATHS - AJUSTES DE STOCK
  # -----------------------------------------------------------
  /ajustes-stock:
    get:
      tags: [Ajustes-Stock]
      summary: Historial paginado de ajustes de stock
      operationId: listarAjustesStock
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortByQuery'
        - $ref: '#/components/parameters/SortDirQuery'
      responses:
        '200':
          description: Historial de ajustes obtenido con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/AjusteStockResponseDTO'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags: [Ajustes-Stock]
      summary: Procesar y registrar un nuevo ajuste de stock
      operationId: crearAjusteStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteStockRequestDTO'
      responses:
        '201':
          description: Ajuste procesado e inventario actualizado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjusteStockResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /ajustes-stock/{idAjuste}:
    get:
      tags: [Ajustes-Stock]
      summary: Obtener detalle completo de un ajuste de stock por ID
      operationId: obtenerAjusteStockPorId
      parameters:
        - name: idAjuste
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ajuste encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjusteStockResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  # -----------------------------------------------------------
  # PATHS - TRANSFERENCIAS DE STOCK
  # -----------------------------------------------------------


  # -----------------------------------------------------------
  # ADMINISTRACIÓN: CONFIGURACIONES
  # -----------------------------------------------------------
  /configuraciones:
    get:
      summary: Obtener parámetros globales de configuración
      tags: [Administracion-General]
      operationId: listarConfiguraciones
      responses:
        '200':
          description: Lista clave-valor del sistema
          content:
            application/json:
              schema:
                type: array
