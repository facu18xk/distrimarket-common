      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPageResponseDTO'
    post:
      tags: [Productos]
      summary: Crear nuevo producto
      operationId: crearProducto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequestDTO'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponseDTO'

  /inventario/productos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Productos]
      summary: Detalle de producto por ID
      operationId: obtenerProductoPorId
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponseDTO'
    put:
      tags: [Productos]
      summary: Actualizar producto existente
      operationId: updateProducto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequestDTO'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponseDTO'
    delete:
      tags: [Productos]
      summary: Eliminar producto
      operationId: deleteProducto
      responses:
        '204':
          description: Producto eliminado con éxito

  /inventario/depositos:
    get:
      tags: [Depositos]
      summary: Listar depósitos paginados
      operationId: listarDepositos
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositoPageResponseDTO'
    post:
      tags: [Depositos]
      summary: Crear depósito
      operationId: crearDeposito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositoRequestDTO'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositoResponseDTO'

  /inventario/depositos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Depositos]
      summary: Obtener depósito por ID
      operationId: obtenerDepositoPorId
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositoResponseDTO'
    put:
      tags: [Depositos]
      summary: Actualizar depósito
      operationId: updateDeposito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositoRequestDTO'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositoResponseDTO'
    delete:
      tags: [Depositos]
      summary: Eliminar depósito
      operationId: deleteDeposito
      responses:
        '204':
          description: Depósito eliminado con éxito

  /inventario/stock-depositos:
    get:
      tags: [Stocks]
      summary: Listar existencias en depósitos
      operationId: listarStockDepositos
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/FilterDepositoQuery'
