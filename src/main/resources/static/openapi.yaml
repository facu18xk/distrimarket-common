        - Ventas-Facturas
      operationId: createFacturaVentaLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaVentaRequestDTO'
      responses:
        '201':
          description: Factura emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaResponseDTO'
        '422':
          description: La factura debe contener al menos un detalle y debe haber stock suficiente en un depósito activo para cada producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentasApiError'
      deprecated: true
  /ventas/facturas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags:
        - Ventas-Facturas
      operationId: getFacturaVentaLegacy
      responses:
        '200':
          description: Factura encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaResponseDTO'
        '404':
          $ref: '#/components/responses/VentasNotFound'
      deprecated: true
    put:
      tags:
        - Ventas-Facturas
      operationId: updateFacturaVentaLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaVentaRequestDTO'
      responses:
        '200':
          description: Factura actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaResponseDTO'
        '404':
          $ref: '#/components/responses/VentasNotFound'
        '422':
          description: La factura debe contener al menos un detalle y debe haber stock suficiente en un depósito activo para cada producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentasApiError'
      deprecated: true
    patch:
      tags:
        - Ventas-Facturas
      operationId: updateEstadoFacturaVentaLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
