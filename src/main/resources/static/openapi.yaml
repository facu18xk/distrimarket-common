          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcaResponseDTO'
    put:
      tags: [Marcas]
      summary: Actualizar marca
      operationId: updateMarca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaRequestDTO'
      responses:
        '200':
