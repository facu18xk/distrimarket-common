      responses:
        '200':
          description: Estado de la factura actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaResponseDTO'
        '400':
          description: El estado debe ser EMITIDA o ANULADA
        '404':
          $ref: '#/components/responses/VentasNotFound'
        '409':
          description: Conflicto con el estado actual de la factura
        '422':
          description: Stock insuficiente para volver a emitir la factura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentasApiError'
      deprecated: true
    delete:
      tags:
        - Ventas-Facturas
      operationId: deleteFacturaVentaLegacy
      description: Marca la cabecera como inactiva, conserva sus detalles y repone el stock si la factura estaba emitida.
      responses:
        '204':
          description: Factura marcada como inactiva; los detalles se conservan
        '404':
          $ref: '#/components/responses/VentasNotFound'
      deprecated: true
