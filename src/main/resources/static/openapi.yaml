              type: array
              items:
                $ref: '#/components/schemas/DepositoResponseDTO'

    StockDepositoPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/SpringDataPageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/StockDepositoResponseDTO'

    PersonaPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/SpringDataPageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/PersonaResponseDTO'

    EmpleadoPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/SpringDataPageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/EmpleadoResponseDTO'

    AjusteStockPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/SpringDataPageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AjusteStockResponseDTO'

    TransferenciaStockPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/SpringDataPageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TransferenciaStockResponseDTO'
    RolUsuario:
      type: string
      description: Rol del sistema; un usuario puede tener varios.
      enum: [ADMIN, VENDEDOR, DEPOSITERO, COMPRADOR]
    StockMovimientoRequestDTO:
      type: object
      required: [idDeposito, motivo, detalles]
      properties:
        idDeposito:
          type: integer
          format: int64
          minimum: 1
          example: 1
          description: "ID del depósito donde se mueve el stock"
        motivo:
          type: string
          minLength: 1
          maxLength: 255
          example: "Venta factura 001-001-0000123"
          description: "Origen del movimiento, para trazabilidad en los logs"
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StockMovimientoDetalleRequestDTO'

    StockMovimientoDetalleRequestDTO:
      type: object
      required: [idProducto, cantidad]
      properties:
        idProducto:
          type: integer
          format: int64
          minimum: 1
          example: 10
          description: "ID del producto"
        cantidad:
          type: integer
          example: -2
          description: "Unidades a mover: positivo ingresa stock, negativo lo descuenta. No puede ser cero"

    MedioPagoRequestDTO:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 50
          example: "Transferencia Bancaria"

    LoginRequestDTO:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
          example: "admin"
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          example: "Admin123!"

    TokenResponseDTO:
      type: object
      required: [accessToken, tokenType, expiresIn, expiresAt, username, roles]
      properties:
        accessToken:
          type: string
          description: JWT firmado; se envía en el encabezado "Authorization Bearer"
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: Segundos de vigencia del token
          example: 3600
        expiresAt:
          type: string
          format: date-time
        username:
          type: string
          example: "admin"
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolUsuario'
        idPersona:
          type: integer
          format: int64
        idEmpleado:
          type: integer
          format: int64
          description: Presente si la persona del usuario es empleado

    TokenInfoDTO:
      type: object
      required: [valido, username, roles, emitidoEn, expiraEn]
      properties:
        valido:
          type: boolean
          example: true
        idUsuario:
          type: integer
          format: int64
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolUsuario'
        idPersona:
          type: integer
          format: int64
        idEmpleado:
          type: integer
          format: int64
        emitidoEn:
          type: string
          format: date-time
        expiraEn:
          type: string
          format: date-time

    UsuarioCreateRequestDTO:
      type: object
      required: [username, password, roles]
      description: Indicar idPersona o idEmpleado (uno de los dos).
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[A-Za-z0-9._-]+$'
          example: "jperez"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: "Vendedor123!"
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RolUsuario'
          example: [VENDEDOR]
        idPersona:
          type: integer
          format: int64
          example: 10
        idEmpleado:
          type: integer
          format: int64
          example: 1

    UsuarioUpdateRequestDTO:
      type: object
      required: [username, roles]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[A-Za-z0-9._-]+$'
          example: "jperez"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Opcional; si se envía, reemplaza la contraseña actual
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RolUsuario'
          example: [ADMIN, VENDEDOR]
    UsuarioResponseDTO:
      type: object
      required: [idUsuario, username, roles, activo]
      properties:
        idUsuario:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: "jperez"
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolUsuario'
        activo:
          type: boolean
          example: true
        idPersona:
          type: integer
          format: int64
        nombreCompleto:
          type: string
          example: "Juan Pérez"
        documento:
          type: string
          description: CI o RUC de la persona
          example: "3456789"
        idEmpleado:
          type: integer
          format: int64
          description: Presente si la persona del usuario es empleado
        cargo:
          type: string
          example: "Cajero"

    UsuarioPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BasePageResponse'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UsuarioResponseDTO'
