          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfiguracionDTO'

# =============================================================
# 3. COMPONENTS
# =============================================================
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador numérico del recurso
      schema:
        type: integer
        format: int64
        minimum: 1

    QueryText:
      name: q
      in: query
      required: false
      description: Búsqueda textual amplia
      schema:
        type: string

    PageQuery:
      name: page
      in: query
      description: Número de página (base 0)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeQuery:
      name: size
      in: query
      description: Tamaño de página (máximo 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    SortQuery:
      name: sort
      in: query
      description: Campo y dirección de ordenamiento
      required: false
      schema:
        type: string
        example: "id,desc"

    FilterNombreQuery:
      name: nombre
      in: query
      required: false
      schema:
        type: string

    FilterCargoQuery:
      name: cargo
      in: query
      required: false
      schema:
        type: string

    FilterEstadoQuery:
      name: estado
      in: query
      schema:
        type: boolean
        default: true

    FilterProveedorQuery:
      name: idProveedor
      in: query
      schema:
        type: integer
        format: int64

    FilterClienteQuery:
      name: idCliente
      in: query
      schema:
        type: integer
        format: int64

    FilterNumeroFacturaQuery:
      name: numeroFactura
      in: query
      schema:
        type: string

    FilterEstadoVentaQuery:
      name: estado
      in: query
      schema:
        $ref: '#/components/schemas/EstadoFacturaVenta'

    FilterFechaDesdeQuery:
      name: fechaDesde
      in: query
      schema:
        type: string
        format: date

    FilterFechaHastaQuery:
      name: fechaHasta
      in: query
      schema:
        type: string
        format: date

    FacturaCompraIdPath:
      name: idFacturaCompra
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ProveedorIdPath:
      name: idProveedor
      in: path
      required: true
      schema:
        type: integer
        format: int64

    FilterCategoriaQuery:
      in: query
      name: categoriaId
      schema:
        type: integer
        format: int64

    FilterMarcaQuery:
      in: query
      name: marcaId
      schema:
        type: integer
        format: int64

    FilterDepositoQuery:
      in: query
      name: depositoId
      schema:
        type: integer
        format: int64

    FilterDepositoOrigenQuery:
      in: query
      name: depositoOrigenId
      schema:
        type: integer
        format: int64

    FilterDepositoDestinoQuery:
      in: query
      name: depositoDestinoId
      schema:
        type: integer
        format: int64

    FilterProductoQuery:
      in: query
      name: productoId
      schema:
        type: integer
        format: int64

    FilterEmpleadoQuery:
      in: query
      name: empleadoId
      schema:
        type: integer
        format: int64

  responses:
    BadRequestResponse:
      description: 400 Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    NotFoundResponse:
      description: 404 Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    ConflictResponse:
      description: 409 Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    UnprocessableEntityResponse:
      description: 422 Unprocessable Entity - Regla de negocio rota
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

  schemas:
    # ---------------------------------------------------------
    # SCHEMAS GENERALES Y ERRORES
    # ---------------------------------------------------------
    FieldErrorDTO:
      type: object
      properties:
        field:
          type: string
          example: "detalles"
        message:
          type: string
          example: "Stock insuficiente en depósito"

    ErrorResponseDTO:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-11T20:30:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Falla de validación en la solicitud"
        path:
          type: string
          example: "/ventas/facturas-venta"
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDTO'
        validationErrors:
          type: object
          additionalProperties:
            type: string

    # ---------------------------------------------------------
    # ENUMS
    # ---------------------------------------------------------
    TipoPersona:
      type: string
      enum: [FISICA, JURIDICA]

    TipoAjuste:
      type: string
      enum: [POSITIVO, NEGATIVO]

    EstadoFacturaVenta:
      type: string
      enum: [EMITIDA, ANULADA]

    # ---------------------------------------------------------
    # COMPRA: SCHEMAS
    # ---------------------------------------------------------
    BaseComprobante:
      type: object
      required: [numeroFactura, fechaEmision]
      properties:
        numeroFactura:
          type: string
          maxLength: 50
          example: "001-001-0001234"
        fechaEmision:
          type: string
          format: date
          example: "2026-09-15"

    BaseComprobanteDetalle:
      type: object
      required: [idProducto, cantidad, precioUnitario]
      properties:
        idProducto:
          type: integer
          format: int64
          example: 101
        cantidad:
          type: integer
          minimum: 1
          example: 10
        precioUnitario:
          type: number
          minimum: 0
          example: 5000.00
        porcentajeIva:
          type: number
          enum: [0, 5, 10]
          default: 10
          example: 10

    FacturaCompraDetalleRequestDTO:
      allOf:
        - $ref: '#/components/schemas/BaseComprobanteDetalle'

    FacturaCompraRequestDTO:
      allOf:
        - $ref: '#/components/schemas/BaseComprobante'
        - type: object
          required: [idProveedor, idDeposito, idMedioPago, timbrado, detalles]
          properties:
            idProveedor:
              type: integer
              format: int64
            idDeposito:
              type: integer
              format: int64
            idMedioPago:
              type: integer
              format: int64
            idOrdenCompra:
              type: integer
              format: int64
              nullable: true
            condicionCompra:
              type: string
              enum: [CONTADO, CREDITO]
              default: CONTADO
            timbrado:
              type: string
              maxLength: 20
            detalles:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FacturaCompraDetalleRequestDTO'

    FacturaCompraDetalleResponseDTO:
      type: object
      required: [idDetalle, idProducto, nombreProducto, cantidad, precioUnitario, subtotal, montoIva]
      properties:
        idDetalle:
          type: integer
          format: int64
        idProducto:
          type: integer
          format: int64
        nombreProducto:
          type: string
        codigoBarra:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          type: number
        subtotal:
          type: number
        porcentajeIva:
          type: number
        montoIva:
          type: number

    FacturaCompraResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BaseComprobante'
        - type: object
          required: [idFacturaCompra, activo, timbrado, totalIva, totalGeneral, estado, condicionCompra, proveedor, deposito, medioPago, detalles]
          properties:
            idFacturaCompra:
              type: integer
              format: int64
            activo:
              type: boolean
            idOrdenCompra:
              type: integer
              format: int64
              nullable: true
            timbrado:
              type: string
            estado:
              type: string
            condicionCompra:
              type: string
            totalIva:
              type: number
            totalGeneral:
              type: number
            proveedor:
              $ref: '#/components/schemas/ProveedorResponseDTO'
            deposito:
              $ref: '#/components/schemas/DepositoResponseDTO'
            medioPago:
              $ref: '#/components/schemas/MedioPagoDTO'
            detalles:
              type: array
              items:
                $ref: '#/components/schemas/FacturaCompraDetalleResponseDTO'

    ProveedorRequestDTO:
      type: object
      required: [persona]
      properties:
        nombreFantasia:
          type: string
          example: "Lácteos del Este"
        estado:
          type: boolean
          default: true
        persona:
          $ref: '#/components/schemas/PersonaRequestDTO'

    ProveedorResponseDTO:
      type: object
      required: [idProveedor, estado, persona]
      properties:
        idProveedor:
          type: integer
          format: int64
        nombreFantasia:
          type: string
        estado:
          type: boolean
        persona:
          $ref: '#/components/schemas/PersonaResponseDTO'

    ProveedorProductoDTO:
      type: object
      required: [idProveedor, idProducto, precioCostoAcordado]
      properties:
        id:
          type: integer
          format: int64
        idProveedor:
          type: integer
          format: int64
        idProducto:
          type: integer
          format: int64
        precioCostoAcordado:
          type: number
          format: double
        codigoProveedor:
          type: string
        activo:
          type: boolean

    OrdenCompraDetalleDTO:
      type: object
      required: [idProducto, cantidad, precioUnitario]
      properties:
        id:
          type: integer
          format: int64
        idProducto:
          type: integer
          format: int64
        cantidad:
          type: integer
        precioUnitario:
          type: number
          format: double
        subtotal:
          type: number
          format: double

    OrdenCompraDTO:
      type: object
      required: [idProveedor, idEmpleado, detalles]
      properties:
        id:
          type: integer
          format: int64
        idProveedor:
          type: integer
          format: int64
        idEmpleado:
          type: integer
          format: int64
        estado:
          type: string
          default: "PENDIENTE"
        observacion:
          type: string
        total:
          type: number
          format: double
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrdenCompraDetalleDTO'

    # ---------------------------------------------------------
    # INVENTARIO: SCHEMAS
    # ---------------------------------------------------------
    PersonaBaseDTO:
      type: object
      required: [tipoPersona, nombreCompleto]
      properties:
        tipoPersona:
          $ref: '#/components/schemas/TipoPersona'
        nombreCompleto:
          type: string
          maxLength: 150
          example: "Comercial San José S.A."
        ci:
          type: string
          maxLength: 20
          example: "3541289"
        ruc:
          type: string
          maxLength: 20
          example: "80012345-6"
        telefono:
          type: string
