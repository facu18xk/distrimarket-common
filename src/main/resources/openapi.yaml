                  $ref: '#/components/schemas/ConfiguracionDTO'

# =============================================================
# 3. COMPONENTS
# =============================================================
components:
  # -----------------------------------------------------------
  # PARÁMETROS REUTILIZABLES (Query & Path)
  # -----------------------------------------------------------
  parameters:
    PageQuery:
      name: page
      in: query
      description: Número de página (base 0)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeQuery:
      name: size
      in: query
      description: Tamaño de página (máximo 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    SortQuery:
      name: sort
      in: query
      description: Campo y dirección de ordenamiento (ej. fechaEmision,desc)
      required: false
      schema:
        type: string
        example: "fechaEmision,desc"

    SortByQuery:
      name: sortBy
      in: query
      description: Ordenar por id
      required: false
      schema:
        type: string
        example: id

    SortDirQuery:
      name: sortDir
      in: query
      description: Ordenar alfabéticamente
      required: false
      schema:
        type: string
        example: asc

    FilterNombreQuery:
      name: nombre
      in: query
      description: Búsqueda textual parcial
      required: false
      schema:
        type: string

    FilterCategoriaQuery:
      name: idCategoria
      in: query
      schema:
        type: integer
        format: int64

    FilterMarcaQuery:
      name: idMarca
      in: query
      schema:
        type: integer
        format: int64

    FilterEstadoQuery:
      name: estado
      in: query
      schema:
        type: boolean
        default: true

    FilterEmpleadoQuery:
      name: idEmpleado
      in: query
      description: Filtrar ventas por empleado vendedor
      schema:
        type: integer
        format: int64

    FilterDepositoQuery:
      name: idDeposito
      in: query
      description: Filtrar por depósito
      schema:
        type: integer
        format: int64

    FilterFechaDesdeQuery:
      name: fechaDesde
      in: query
      description: Fecha mínima (formato YYYY-MM-DD)
      schema:
        type: string
        format: date

    FilterFechaHastaQuery:
      name: fechaHasta
      in: query
      description: Fecha máxima (formato YYYY-MM-DD)
      schema:
        type: string
        format: date

  # -----------------------------------------------------------
  # RESPUESTAS DE ERROR REUTILIZABLES (RFC 7807)
  # -----------------------------------------------------------
  responses:
    BadRequestResponse:
      description: 400 Bad Request - Formato o validaciones de campo incorrectos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    UnauthorizedResponse:
      description: 401 Unauthorized - Token no proporcionado o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    ForbiddenResponse:
      description: 403 Forbidden - No cuenta con roles ni permisos suficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    NotFoundResponse:
      description: 404 Not Found - El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    ConflictResponse:
      description: 409 Conflict - Clave duplicada o estado contradictorio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    InternalServerErrorResponse:
      description: 500 Internal Server Error - Error inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

  # -----------------------------------------------------------
  # 4. SCHEMAS (DTOs)
  # -----------------------------------------------------------
  schemas:
    # ---------------------------------------------------------
    # SCHEMA - DETALLE DE ERROR DE CAMPO
    # ---------------------------------------------------------
    FieldErrorDTO:
      type: object
      properties:
        field:
          type: string
          example: "detalles"
        message:
          type: string
          example: "La factura debe tener al menos un producto"

    # ---------------------------------------------------------
    # SCHEMA - ERROR ESTÁNDAR
    # ---------------------------------------------------------
    ErrorResponseDTO:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-21T18:00:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validación de formulario fallida"
        path:
          type: string
          example: "/api/v1/ajustes-stock"
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDTO'

    # ---------------------------------------------------------
    # SCHEMA - ENUMS
    # ---------------------------------------------------------
    TipoPersona:
      type: string
      enum:
        - FISICA
        - JURIDICA
      example: JURIDICA
      description: Tipo de persona (FISICA o JURIDICA)


    TipoAjuste:
      type: string
      enum:
        - POSITIVO
        - NEGATIVO
      example: "POSITIVO"
      description: Tipo de ajuste de stock (POSITIVO o NEGATIVO)


    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE CATEGORÍAS (Request)
    # ---------------------------------------------------------
    CategoriaRequestDTO:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 80
          example: "Bebidas"
          description: "Nombre único de la categoría"
        descripcion:
          type: string
          maxLength: 200
          example: "Gaseosas, jugos y bebidas alcohólicas"
          description: "Descripción detallada de la categoría"

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE CATEGORÍAS (Response)
    # ---------------------------------------------------------
    CategoriaResponseDTO:
      type: object
      required: [idCategoria, nombre, descripcion]
      properties:
        idCategoria:
          type: integer
          format: int64
          example: 1
          description: "Identificador único de la categoría"
        nombre:
          type: string
          example: "Bebidas"
        descripcion:
          type: string
          example: "Gaseosas, jugos y bebidas alcohólicas"

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE MARCAS (Request)
    # ---------------------------------------------------------
    MarcaRequestDTO:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 80
          example: "Coca-Cola"
          description: "Nombre único de la marca"

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE MARCAS (Response)
    # ---------------------------------------------------------
    MarcaResponseDTO:
      type: object
      required: [idMarca, nombre]
      properties:
        idMarca:
          type: integer
          format: int64
          example: 1
          description: "Identificador único de la marca"
        nombre:
          type: string
          example: "Coca-Cola"

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE PRODUCTOS (Request)
    # ---------------------------------------------------------
    ProductoRequestDTO:
      type: object
      required: [nombre, precioCosto, precioVenta, porcentajeIva, stockMinimo, idCategoria, idMarca]
      properties:
        codigoBarra:
          type: string
          example: "7840001234567"
        nombre:
          type: string
          example: "Leche Entera 1L"
        descripcion:
          type: string
          example: "Leche ultra pasteurizada cartón 1 litro"
        precioCosto:
          type: number
          example: 4500.00
        precioVenta:
          type: number
          example: 6000.00
        porcentajeIva:
          type: number
          enum: [0, 5, 10]
          example: 10
        stockMinimo:
          type: integer
          example: 10
        idCategoria:
          type: integer
          format: int64
          example: 1
        idMarca:
          type: integer
          format: int64
          example: 1
        estado:
          type: boolean
          default: true

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE PRODUCTOS (Response)
    # ---------------------------------------------------------
    ProductoResponseDTO:
      type: object
      required: [idProducto, nombre, precioVenta, stockActual, estado]
      properties:
        idProducto:
          type: integer
          format: int64
          example: 101
        codigoBarra:
          type: string
          example: "7840001234567"
        nombre:
          type: string
          example: "Leche Entera 1L"
        precioVenta:
          type: number
          example: 6000.00
        stockActual:
          type: integer
          example: 42
        estado:
          type: boolean
          example: true

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE DEPÓSITOS (Request)
    # ---------------------------------------------------------
    DepositoRequestDTO:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 80
          example: "Depósito Central"
          description: "Nombre único del depósito"
        ubicacion:
          type: string
          maxLength: 150
          example: "Av. Principal 123, Bodega A"
          description: "Dirección o ubicación física del depósito"
        estado:
          type: boolean
          default: true
          example: true
          description: "Estado operativo del depósito (activo/inactivo)"

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE DEPÓSITOS (Response)
    # ---------------------------------------------------------
    DepositoResponseDTO:
      type: object
      required: [idDeposito, nombre, ubicacion, estado]
      properties:
        idDeposito:
          type: integer
          format: int64
          example: 1
          description: "Identificador único del depósito"
        nombre:
          type: string
          example: "Depósito Central"
        ubicacion:
          type: string
          example: "Av. Principal 123, Bodega A"
        estado:
          type: boolean
          example: true

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE STOCK DEPÓSITO (Request)
    # ---------------------------------------------------------
    StockDepositoRequestDTO:
      type: object
      required: [idDeposito, idProducto, cantidad]
      properties:
        idDeposito:
          type: integer
          format: int64
          example: 1
          description: "ID del depósito asociado"
        idProducto:
          type: integer
          format: int64
          example: 10
          description: "ID del producto asociado"
        cantidad:
          type: integer
          minimum: 0
          example: 50
          description: "Cantidad de unidades en stock para el producto en dicho depósito"

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE STOCK DEPÓSITO (Response)
    # ---------------------------------------------------------
    StockDepositoResponseDTO:
      type: object
      required: [idStock, idDeposito, idProducto, cantidad]
      properties:
        idStock:
          type: integer
          format: int64
          example: 1
        idDeposito:
          type: integer
          format: int64
          example: 1
        nombreDeposito:
          type: string
          example: "Depósito Central"
        idProducto:
          type: integer
          format: int64
          example: 10
        nombreProducto:
          type: string
          example: "Coca-Cola 1.5L"
        cantidad:
          type: integer
          example: 50

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE PERSONA (Request)
    # ---------------------------------------------------------
    PersonaRequestDTO:
      type: object
      required: [tipoPersona, nombreCompleto]
      properties:
        tipoPersona:
          $ref: '#/components/schemas/TipoPersona'
        ci:
          type: string
          maxLength: 20
          example: "4521369"
          description: Cédula de Identidad. Obligatorio si tipoPersona es FISICA.
        ruc:
          type: string
          maxLength: 20
          example: "80012345-6"
          description: Registro Único de Contribuyente. Obligatorio si tipoPersona es JURIDICA.
        nombreCompleto:
          type: string
          maxLength: 150
          example: "Juan Carlos Pérez"
          description: Razón Social (para Jurídica) o Nombres y Apellidos (para Física).
        telefono:
          type: string
          maxLength: 30
          example: "0981123456"
        correo:
          type: string
          format: email
          maxLength: 100
          example: "juan.perez@email.com"
        direccion:
          type: string
          maxLength: 200
          example: "Av. San Martín 1234, Asunción"

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE PERSONA (Response)
    # ---------------------------------------------------------
    PersonaResponseDTO:
      type: object
      properties:
        idPersona:
          type: integer
          format: int64
          example: 1
        tipoPersona:
          $ref: '#/components/schemas/TipoPersona'
        ci:
          type: string
          example: "4521369"
        ruc:
          type: string
          example: "80012345-6"
        nombreCompleto:
          type: string
          example: "Juan Carlos Pérez"
        telefono:
          type: string
          example: "0981123456"
        correo:
          type: string
          example: "juan.perez@email.com"
        direccion:
          type: string
          example: "Av. San Martín 1234, Asunción"

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE EMPLEADO (Request)
    # ---------------------------------------------------------
    EmpleadoRequestDTO:
      type: object
      required: [idPersona, cargo, fechaIngreso, estado]
      properties:
        idPersona:
          type: integer
          format: int64
          example: 1
          description: ID de la Persona (previamente registrada)
        cargo:
          type: string
          maxLength: 60
          example: "Depositario / Cajero"
        fechaIngreso:
          type: string
          format: date
          example: "2026-01-15"
        estado:
          type: boolean
          default: true

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE EMPLEADO (Response)
    # ---------------------------------------------------------
    EmpleadoResponseDTO:
      type: object
      required: [idEmpleado, idPersona, nombreCompletoPersona, ciPersona, cargo, fechaIngreso, estado]
      properties:
        idEmpleado:
          type: integer
          format: int64
          example: 10
        idPersona:
          type: integer
          format: int64
          example: 1
        nombreCompletoPersona:
          type: string
          example: "Juan Carlos Pérez"
        ciPersona:
          type: string
          example: "4521369"
        cargo:
          type: string
          example: "Depositario / Cajero"
        fechaIngreso:
          type: string
          format: date
          example: "2026-01-15"
        estado:
          type: boolean
          example: true

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE AJUSTES DE STOCK (Request)
    # ---------------------------------------------------------
    AjusteStockRequestDTO:
      type: object
      required: [idDeposito, idEmpleado, motivo, tipoAjuste, detalles]
      properties:
        idDeposito:
          type: integer
          format: int64
          example: 1
        idEmpleado:
          type: integer
          format: int64
          example: 3
        motivo:
          type: string
          maxLength: 200
          example: "Mercadería dañada en transporte"
        tipoAjuste:
          $ref: '#/components/schemas/TipoAjuste'
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/AjusteStockDetalleRequestDTO'

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE AJUSTES DE STOCK (Response)
    # ---------------------------------------------------------
    AjusteStockResponseDTO:
      type: object
      required: [idAjuste, idDeposito, nombreDeposito, idEmpleado, nombreEmpleado, motivo, tipoAjuste, detalles]
      properties:
        idAjuste:
          type: integer
          format: int64
          example: 1
        idDeposito:
          type: integer
          format: int64
          example: 1
        nombreDeposito:
          type: string
          example: "Depósito Central"
        idEmpleado:
          type: integer
          format: int64
          example: 3
        nombreEmpleado:
          type: string
          example: "Carlos Gómez"
        motivo:
          type: string
          example: "Mercadería dañada en transporte"
        tipoAjuste:
          $ref: '#/components/schemas/TipoAjuste'
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/AjusteStockDetalleResponseDTO'

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE DETALLES DE AJUSTES DE STOCK (Request)
    # ---------------------------------------------------------
    AjusteStockDetalleRequestDTO:
      type: object
      required: [idAjuste, idProducto, cantidad]
      properties:
        idAjuste:
          type: integer
          format: int64
          example: 101
        idProducto:
          type: integer
          format: int64
          example: 10
        cantidad:
          type: integer
          minimum: 1
          example: 15

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE DETALLES DE AJUSTES DE STOCK (Response)
    # ---------------------------------------------------------
    AjusteStockDetalleResponseDTO:
      type: object
      required: [idAjuste, idProducto, nombreProducto, cantidad]
      properties:
        idAjuste:
          type: integer
          format: int64
          example: 101
        idProducto:
          type: integer
          format: int64
          example: 10
        nombreProducto:
          type: string
          example: "Coca-Cola 1.5L"
        cantidad:
          type: integer
          example: 15

    # ---------------------------------------------------------
    # SCHEMA - SOLICITUD DE TRANSFERENCIAS DE STOCK (Request)
    # ---------------------------------------------------------

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTA DE TRANSFERENCIAS DE STOCK (Response)
    # ---------------------------------------------------------

    # ---------------------------------------------------------
    # SCHEMA - CONFIGURACIÓN DTO (Administrativo)
    # ---------------------------------------------------------
    ConfiguracionDTO:
      type: object
      required: [idConfiguracion, clave, valor]
      properties:
        idConfiguracion:
          type: integer
          format: int64
          example: 1
        clave:
          type: string
          example: "IVA_DEFECTO"
        valor:
          type: string
          example: "10"
        descripcion:
          type: string
          example: "Tasa general de IVA aplicada por omisión"

    # ---------------------------------------------------------
    # SCHEMA - PAGINACIÓN BASE
    # ---------------------------------------------------------
    BasePageResponse:
      type: object
      required: [pageNumber, pageSize, totalElements, totalPages, isFirst, isLast]
      properties:
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 85
        totalPages:
          type: integer
          example: 9
        isFirst:
          type: boolean
          example: true
        isLast:
          type: boolean
          example: false

    # ---------------------------------------------------------
    # SCHEMA - RESPUESTAS PAGINADAS (Heredan de BasePageResponse)
    # ---------------------------------------------------------
    CategoriaPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BasePageResponse'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/CategoriaResponseDTO'

    MarcaPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BasePageResponse'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/MarcaResponseDTO'

    ProductoPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BasePageResponse'
        - type: object
          required: [ content ]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ProductoResponseDTO'

    DepositoPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BasePageResponse'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/DepositoResponseDTO'

    StockDepositoPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BasePageResponse'
        - type: object
          required: [content]
          properties:
            content:
