# =============================================================
# 3. COMPONENTS
# =============================================================
  /compras/facturas/{idFacturaCompra}/anular:
    patch:
      operationId: anularFacturaCompra
      tags:
        - Compras-Facturas
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaCompraResponseDTO'
      parameters:
        - $ref: '#/components/parameters/FacturaCompraIdPath'
  /compras/ordenes/{idOrdenCompra}/estado:
    patch:
      operationId: cambiarEstadoOrdenCompra
      tags:
        - Compras-Ordenes
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'
      parameters:
        - name: idOrdenCompra
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: estado
          in: query
          required: true
          schema:
            type: string
  /compras/facturas/buscar:
    get:
      summary: Buscar facturas de compra con filtros combinables y paginación
      description: 'Búsqueda paginada de facturas de compra. Todos los filtros son opcionales y combinables; la paginación (page, size, sort) es obligatoria.'
      tags:
        - Compras-Facturas
      operationId: buscarFacturasCompra
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
        - name: proveedorId
          in: query
          description: Filtra por proveedor
          required: false
          schema:
            type: integer
            format: int64
            example: 5
        - name: depositoId
          in: query
          description: Filtra por depósito
          required: false
          schema:
            type: integer
            format: int64
            example: 7
        - name: estado
          in: query
          description: Filtra por estado exacto (ACTIVA, ANULADA)
          required: false
          schema:
            type: string
            example: ACTIVA
        - name: desde
          in: query
          description: Fecha de emisión mínima (inclusive)
          required: false
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: hasta
          in: query
          description: Fecha de emisión máxima (inclusive)
          required: false
          schema:
            type: string
            format: date
            example: '2026-12-31'
        - name: numeroFactura
          in: query
          description: Coincidencia parcial con el número de factura
          required: false
          schema:
            type: string
            example: '001-001'
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaCompraPageResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
  /ventas/facturas:
    get:
      tags:
        - Ventas-Facturas
      operationId: listFacturasVentaLegacy
      responses:
        '200':
          description: Facturas paginadas con cabecera y detalles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaPageResponseDTO'
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
        - name: q
          in: query
          schema:
            type: string
      deprecated: true
    post:
