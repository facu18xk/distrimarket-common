components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido por POST /auth/login

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador numérico del recurso
      schema:
        type: integer
        format: int64
        minimum: 1

    CiPath:
      name: ci
      in: path
      required: true
      description: Número de CI de la persona
      schema:
        type: string
        maxLength: 20

    RucPath:
      name: ruc
      in: path
      required: true
      description: Número de RUC de la persona
      schema:
        type: string
        maxLength: 20

    QueryText:
      name: q
      in: query
      required: false
      description: Búsqueda textual amplia
      schema:
        type: string

    PageQuery:
      name: page
      in: query
      description: Número de página (base 0)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeQuery:
      name: size
      in: query
      description: Tamaño de página (máximo 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    SortQuery:
      name: sort
      in: query
      description: Campo y dirección de ordenamiento
      required: false
      schema:
        type: string
        example: "id,desc"

    FilterNombreQuery:
      name: nombre
      in: query
      required: false
      schema:
        type: string

    FilterCargoQuery:
      name: cargo
      in: query
      required: false
      schema:
        type: string

    FilterEstadoQuery:
      name: estado
      in: query
      schema:
        type: boolean
        default: true

    FilterProveedorQuery:
      name: idProveedor
      in: query
      schema:
        type: integer
        format: int64

    FilterClienteQuery:
      name: idCliente
      in: query
      schema:
        type: integer
        format: int64

    FilterNumeroFacturaQuery:
      name: numeroFactura
      in: query
      schema:
        type: string

    FilterEstadoVentaQuery:
      name: estado
      in: query
      schema:
        $ref: '#/components/schemas/EstadoFacturaVenta'

    FilterFechaDesdeQuery:
      name: fechaDesde
      in: query
      schema:
        type: string
        format: date

    FilterFechaHastaQuery:
      name: fechaHasta
      in: query
      schema:
        type: string
        format: date

    FacturaCompraIdPath:
      name: idFacturaCompra
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ProveedorIdPath:
      name: idProveedor
      in: path
      required: true
      schema:
        type: integer
        format: int64

    FilterCategoriaQuery:
      in: query
      name: categoriaId
      schema:
        type: integer
        format: int64

    FilterMarcaQuery:
      in: query
      name: marcaId
      schema:
        type: integer
        format: int64

    FilterDepositoQuery:
      in: query
      name: depositoId
      schema:
        type: integer
        format: int64

    FilterDepositoOrigenQuery:
      in: query
      name: depositoOrigenId
      schema:
        type: integer
        format: int64

    FilterDepositoDestinoQuery:
      in: query
      name: depositoDestinoId
      schema:
        type: integer
        format: int64

    FilterProductoQuery:
      in: query
      name: productoId
      schema:
        type: integer
        format: int64

    FilterEmpleadoQuery:
      in: query
      name: empleadoId
      schema:
        type: integer
        format: int64

    SortByQuery:
      name: sortBy
      in: query
      description: Ordenar por id
      required: false
      schema:
        type: string
        example: id

    SortDirQuery:
      name: sortDir
      in: query
      description: Ordenar alfabéticamente
      required: false
      schema:
        type: string
        example: asc

    FilterActivoQuery:
      name: activo
      in: query
      schema:
        type: boolean
        default: true

    ProductoIdPath:
      name: idProducto
      in: path
      required: true
      schema:
        type: integer
        format: int64

    FacturaVentaIdPath:
      name: idFacturaVenta
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ClienteIdPath:
      name: idCliente
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    # ---------------------------------------------------------
    # SCHEMAS DE RESPUESTA DE ERRORES
    # ---------------------------------------------------------
    BadRequestResponse:
      description: 400 Bad Request - Formato o validaciones de campo incorrectos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    UnauthorizedResponse:
      description: 401 Unauthorized - Token no proporcionado o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    ForbiddenResponse:
      description: 403 Forbidden - No cuenta con roles ni permisos suficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    NotFoundResponse:
      description: 404 Not Found  - El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    ConflictResponse:
      description: 409 Conflict - Clave duplicada o estado contradictorio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    UnprocessableEntityResponse:
      description: 422 Unprocessable Entity - Regla de negocio rota
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    ServiceUnavailableResponse:
      description: 503 Service Unavailable - Otro microservicio requerido por la operación no responde
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    InternalServerErrorResponse:
      description: 500 Internal Server Error - Error inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    VentasNotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VentasApiError'

  schemas:
    # ---------------------------------------------------------
    # SCHEMAS GENERALES Y ERRORES
    # ---------------------------------------------------------
    VentasApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string

    MedioPagoPageResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BasePageResponse'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/MedioPagoDTO'

    SpringDataPageResponse:
      type: object
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
        empty:
          type: boolean
        pageable:
          type: object
        sort:
          type: object

    ComprasPageResponse:
      type: object
      properties:
        numeroPagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
        primera:
          type: boolean
        ultima:
          type: boolean

    DepositoDTO:
      type: object
      required:
        - idDeposito
        - nombre
        - estado
      properties:
        nombre:
          type: string
          example: Depósito Central
        ubicacion:
          type: string
          example: Av. Principal 123, Bodega A
        estado:
          type: boolean
          example: true
        idDeposito:
          type: integer
          format: int64
          example: 1
          description: Identificador único del depósito

    PersonaDTO:
      allOf:
        - $ref: '#/components/schemas/PersonaBaseDTO'
        - type: object
          properties:
            idPersona:
              type: integer
              format: int64
          required:
            - idPersona

    PersonaCreateDTO:
      allOf:
        - $ref: '#/components/schemas/PersonaBaseDTO'

    # ---------------------------------------------------------
    # SCHEMA - DETALLE DE ERROR DE CAMPO
    # ---------------------------------------------------------
    FieldErrorDTO:
      type: object
      properties:
        field:
          type: string
          example: "detalles"
        message:
          type: string
          example: "La factura debe tener al menos un producto"

    # ---------------------------------------------------------
    # SCHEMA - ERROR ESTÁNDAR
    # ---------------------------------------------------------
    ErrorResponseDTO:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-21T18:00:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validación de formulario fallida"
        path:
          type: string
          example: "/api/v1/ajustes-stock"
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDTO'

    # ---------------------------------------------------------
    # SCHEMA - ENUMS
    # ---------------------------------------------------------
        validationErrors:
          type: object
          additionalProperties:
            type: string

    # ---------------------------------------------------------
    # ENUMS
    # ---------------------------------------------------------
    TipoPersona:
      type: string
      enum:
        - FISICA
        - JURIDICA
      example: JURIDICA
      description: Tipo de persona (FISICA o JURIDICA)

    TipoAjuste:
      type: string
      enum:
        - POSITIVO
        - NEGATIVO
      example: POSITIVO
      description: Tipo de ajuste de stock (POSITIVO o NEGATIVO)

    EstadoFacturaVenta:
      type: string
      enum:
        - EMITIDA
        - ANULADA
      example: EMITIDA
      description: Estado de la factura de venta (EMITIDA o ANULADA)

    # ---------------------------------------------------------
    # SCHEMA - PERSONA DTO
    # (Reutilizado por Cliente, Proveedor, Empleado y Usuario)
    # ---------------------------------------------------------
    PersonaBaseDTO:
      type: object
      required: [tipoPersona, nombreCompleto]
      properties:
        tipoPersona:
          $ref: '#/components/schemas/TipoPersona'
        nombreCompleto:
          type: string
          maxLength: 150
          description: Razón Social (para Jurídica) o Nombres y Apellidos (para Física).
          example: "Distribuidora del Este S.A. o Juan Carlos Pérez"
        ci:
          type: string
          maxLength: 20
          description: Cédula de Identidad (Obligatoria si tipoPersona es FISICA)
          example: "4123456"
        ruc:
          type: string
          maxLength: 20
          description: Registro Único de Contribuyente (Obligatorio si es JURIDICA)
          example: "80012345-6"
        telefono:
          type: string
          maxLength: 30
          example: "0985123123"
        correo:
          type: string
          format: email
          maxLength: 100
          example: "juan.perez@email.com"
        direccion:
          type: string
          maxLength: 200
          example: "Avda. Eusebio Ayala 2450"

    PersonaRequestDTO:
      allOf:
        - $ref: '#/components/schemas/PersonaBaseDTO'

    PersonaResponseDTO:
      allOf:
        - $ref: '#/components/schemas/PersonaBaseDTO'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 10

    # ---------------------------------------------------------
    # SCHEMA - PROVEEDOR
    # ---------------------------------------------------------
    ProveedorRequestDTO:
      type: object
      required:
        - persona
      properties:
        nombreFantasia:
          type: string
          maxLength: 150
          example: Lácteos del Este
        estado:
          type: boolean
          default: true
        persona:
          $ref: '#/components/schemas/PersonaCreateDTO'

    ProveedorResponseDTO:
      type: object
      required:
        - idProveedor
        - estado
        - persona
      properties:
        idProveedor:
          type: integer
          format: int64
          example: 5
        nombreFantasia:
          type: string
          example: Lácteos del Este
        estado:
          type: boolean
          example: true
        persona:
          $ref: '#/components/schemas/PersonaDTO'

    ClienteRequestDTO:
      type: object
      required: [persona]
      properties:
        persona:
          $ref: '#/components/schemas/PersonaRequestDTO'

    ClienteResponseDTO:
      type: object
      required: [idCliente, estado, persona]
      properties:
        idCliente:
          type: integer
          format: int64
          example: 12
        estado:
          type: boolean
          example: true
        persona:
          $ref: '#/components/schemas/PersonaResponseDTO'

    ClientePatchRequestDTO:
      type: object
      properties:
        persona:
          $ref: '#/components/schemas/PersonaRequestDTO'

    EmpleadoRequestDTO:
      type: object
      required: [cargo, fechaIngreso, persona]
      properties:
        cargo:
          type: string
          maxLength: 60
          example: "Depositario / Cajero"
        fechaIngreso:
          type: string
          format: date
          example: "2024-02-01"
        estado:
          type: boolean
          default: true
        persona:
          $ref: '#/components/schemas/PersonaRequestDTO'

    EmpleadoResponseDTO:
      type: object
      required: [id, cargo, fechaIngreso, estado, persona]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        cargo:
          type: string
          example: "Depositario / Cajero"
        fechaIngreso:
          type: string
          format: date
          example: "2024-02-01"
        estado:
          type: boolean
          example: true
        persona:
          $ref: '#/components/schemas/PersonaResponseDTO'

    # ---------------------------------------------------------
    # SCHEMA - COMPROBANTE Y COMPROBANTE DETALLE
    # ---------------------------------------------------------
    BaseComprobante:
      type: object
      required: [numeroFactura, fechaEmision]
      properties:
        numeroFactura:
          type: string
          maxLength: 50
          description: Formato fiscal (ej. 001-001-0001234)
          example: "001-001-0001234"
        fechaEmision:
          type: string
          format: date
          description: Fecha de emisión del comprobante
          example: "2026-09-15"

    BaseComprobanteDetalle:
      type: object
      required: [idProducto, cantidad, precioUnitario]
      properties:
        idProducto:
          type: integer
          format: int64
          example: 101
        cantidad:
          type: integer
          minimum: 1
          example: 10
        precioUnitario:
          type: number
          minimum: 0
          example: 5000.00
        porcentajeIva:
          type: number
          enum: [0, 5, 10]
          default: 10
          example: 10

    # ---------------------------------------------------------
    # SCHEMA - COMPRAS: FACTURAS (Cabecera y Detalle)
    # ---------------------------------------------------------
    FacturaCompraDetalleRequestDTO:
      allOf:
        - $ref: '#/components/schemas/BaseComprobanteDetalle'

    FacturaCompraRequestDTO:
      allOf:
        - $ref: '#/components/schemas/BaseComprobante'
        - type: object
          required: [idProveedor, idDeposito, idMedioPago, timbrado, detalles]
          properties:
            idProveedor:
              type: integer
              format: int64
              example: 5
            idDeposito:
              type: integer
              format: int64
              description: Depósito receptor del stock
              example: 1
            idMedioPago:
              type: integer
              format: int64
              example: 1
            idOrdenCompra:
              type: integer
              format: int64
              nullable: true
              description: ID de la orden de compra asociada (opcional)
              example: 10
            condicionCompra:
              type: string
              enum: [CONTADO, CREDITO]
              default: CONTADO
              example: "CONTADO"
            timbrado:
