      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDepositoPageResponseDTO'
    post:
      tags: [Stocks]
      summary: Inicializar o asignar stock
      operationId: crearStockDeposito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockDepositoRequestDTO'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDepositoResponseDTO'

  /inventario/stock-depositos/{id}:
