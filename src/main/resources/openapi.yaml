        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    put:
      tags: [Depositos]
      summary: Actualizar un depósito existente
      operationId: updateDeposito
      parameters:
        - name: idDeposito
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositoRequestDTO'
      responses:
        '200':
          description: Marca actualizada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositoResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    delete:
      tags: [Depositos]
      summary: Eliminar depósito por ID
      operationId: deleteDeposito
      parameters:
        - name: idDeposito
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Depósito eliminado con éxito
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  # -----------------------------------------------------------
  # PATHS - STOCK DEPÓSITOS
  # -----------------------------------------------------------
  /stock-depositos:
    get:
      tags: [Stocks]
      summary: Obtener lista paginada de existencias en depósito
      operationId: listarStockDepositos
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortByQuery'
        - $ref: '#/components/parameters/SortDirQuery'
      responses:
        '200':
          description: Lista paginada obtenida con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDepositoPageResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    post:
      tags: [Stocks]
      summary: Asignar o inicializar stock de un producto en un depósito
      operationId: crearStockDeposito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockDepositoRequestDTO'
      responses:
        '201':
          description: Stock creado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDepositoResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /stock-depositos/{idStock}:
    get:
      tags: [Stocks]
      summary: Obtener detalle de stock por ID
      operationId: obtenerStockDepositoPorId
      parameters:
        - name: idStock
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Registro de stock encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDepositoResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    put:
      tags: [Stocks]
      summary: Actualizar la cantidad de stock
      operationId: updateStockDeposito
      parameters:
        - name: idStock
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockDepositoRequestDTO'
      responses:
        '200':
          description: Stock actualizado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDepositoResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    delete:
      tags: [Stocks]
      summary: Eliminar registro de stock
      operationId: deleteStockDeposito
      parameters:
        - name: idStock
          in: path
          required: true
          schema:
            type: integer
