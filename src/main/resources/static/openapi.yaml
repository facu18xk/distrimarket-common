      type: object
      required: [ idProducto, cantidad ]
      properties:
        idProducto:
          type: integer
          format: int64
          example: 10
          description: "ID del producto a transferir"
        cantidad:
          type: integer
          minimum: 1
          example: 20
          description: "Cantidad de unidades a transferir (debe ser mayor a 0)"

