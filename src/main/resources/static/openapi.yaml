    post:
      tags: [Marcas]
      summary: Crear una nueva marca
      operationId: crearMarca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaRequestDTO'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcaResponseDTO'

  /inventario/marcas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Marcas]
      summary: Obtener marca por ID
