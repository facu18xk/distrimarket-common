components:
  # -----------------------------------------------------------
  # PARÁMETROS REUTILIZABLES (Query & Path)
  # -----------------------------------------------------------
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    PageQuery:
      name: page
      in: query
      description: Número de página (base 0)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeQuery:
      name: size
      in: query
      description: Tamaño de página (máximo 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    SortQuery:
      name: sort
      in: query
      description: Campo válido del recurso y dirección de ordenamiento (campo,asc o campo,desc). Omitir para usar el orden predeterminado del servicio.
      required: false
      schema:
        type: string

    SortByQuery:
      name: sortBy
      in: query
      description: Ordenar por id
      required: false
      schema:
        type: string
        example: id

    SortDirQuery:
      name: sortDir
      in: query
      description: Ordenar alfabéticamente
      required: false
      schema:
        type: string
        example: asc

    FilterNombreQuery:
      name: nombre
      in: query
      description: Búsqueda textual parcial
      required: false
      schema:
        type: string

    FilterCargoQuery:
      name: cargo
      in: query
      description: Búsqueda textual por cargo
      required: false
      schema:
        type: string

    FilterEstadoQuery:
      name: estado
      in: query
      schema:
        type: boolean
        default: true

    FilterActivoQuery:
      name: activo
      in: query
      schema:
        type: boolean
        default: true

    FilterProveedorQuery:
      name: idProveedor
      in: query
      description: Filtrar compras por ID de proveedor
      schema:
        type: integer
        format: int64

    FilterClienteQuery:
      name: idCliente
      in: query
      description: Filtrar ventas por ID de cliente
      schema:
        type: integer
        format: int64

    FilterNumeroFacturaQuery:
      name: numeroFactura
      in: query
      description: Búsqueda exacta o parcial de número de factura
      schema:
        type: string

    FilterEstadoVentaQuery:
      name: estado
      in: query
      description: Estado de la factura de venta (EMITIDA, ANULADA)
      schema:
        $ref: '#/components/schemas/EstadoFacturaVenta'

    FilterFechaDesdeQuery:
      name: fechaDesde
      in: query
      description: Fecha mínima (formato YYYY-MM-DD)
      schema:
        type: string
        format: date

    FilterFechaHastaQuery:
      name: fechaHasta
      in: query
      description: Fecha máxima (formato YYYY-MM-DD)
      schema:
        type: string
        format: date

    ProductoIdPath:
      name: idProducto
      in: path
      required: true
      schema:
        type: integer
        format: int64

    FacturaCompraIdPath:
      name: idFacturaCompra
      in: path
      required: true
      schema:
        type: integer
        format: int64

    FacturaVentaIdPath:
      name: idFacturaVenta
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ProveedorIdPath:
      name: idProveedor
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ClienteIdPath:
      name: idCliente
      in: path
      required: true
      schema:
        type: integer
        format: int64

    FilterCategoriaQuery:
      in: query
      name: categoriaId
      description: Filtrar por ID de categoría
      required: false
      schema:
        type: integer
        format: int64

    FilterMarcaQuery:
      in: query
      name: marcaId
      description: Filtrar por ID de marca
      required: false
      schema:
        type: integer
        format: int64

    FilterDepositoQuery:
      in: query
      name: depositoId
      description: Filtrar por ID de depósito
      required: false
      schema:
        type: integer
        format: int64

    FilterDepositoOrigenQuery:
      in: query
      name: depositoOrigenId
      description: Filtrar por ID de depósito de origen
      required: false
      schema:
        type: integer
        format: int64

    FilterDepositoDestinoQuery:
      in: query
      name: depositoDestinoId
      description: Filtrar por ID de depósito de destino
      required: false
      schema:
        type: integer
        format: int64

    FilterProductoQuery:
      in: query
      name: productoId
      description: Filtrar por ID de producto
      required: false
      schema:
        type: integer
        format: int64

    FilterEmpleadoQuery:
      in: query
      name: empleadoId
      description: Filtrar por ID de empleado
      required: false
      schema:
        type: integer
        format: int64

  # -----------------------------------------------------------
  # RESPUESTAS DE ERROR REUTILIZABLES (RFC 7807)
  # -----------------------------------------------------------
  responses:
    VentasNotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VentasApiError'

    BadRequestResponse:
      description: 400 Bad Request - Formato o validaciones de campo incorrectos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    UnauthorizedResponse:
      description: 401 Unauthorized - Token no proporcionado o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    ForbiddenResponse:
      description: 403 Forbidden - No cuenta con roles ni permisos suficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    NotFoundResponse:
      description: 404 Not Found - El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    ConflictResponse:
      description: 409 Conflict - Clave duplicada o estado contradictorio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

    InternalServerErrorResponse:
      description: 500 Internal Server Error - Error inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDTO'

  # -----------------------------------------------------------
  # 4. SCHEMAS (DTOs)
  # -----------------------------------------------------------
  schemas:
    VentasApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string

    MedioPagoPageResponseDTO:
      allOf:
      - $ref: '#/components/schemas/ComprasPageResponse'
      - type: object
        properties:
          contenido:
            type: array
            items:
              $ref: '#/components/schemas/MedioPagoDTO'

    SpringDataPageResponse:
      type: object
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
        empty:
          type: boolean
        pageable:
          type: object
        sort:
          type: object

    ComprasPageResponse:
      type: object
      properties:
        numeroPagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
        primera:
          type: boolean
        ultima:
          type: boolean

    DepositoDTO:
      type: object
      required:
      - idDeposito
      - nombre
      - estado
      properties:
        nombre:
          type: string
          example: Depósito Central
        ubicacion:
          type: string
          example: Av. Principal 123, Bodega A
        estado:
          type: boolean
          example: true
        idDeposito:
          type: integer
          format: int64
          example: 1
          description: Identificador único del depósito

    PersonaDTO:
      allOf:
      - $ref: '#/components/schemas/PersonaBaseDTO'
      - type: object
        properties:
          idPersona:
            type: integer
            format: int64
        required:
        - idPersona

    PersonaCreateDTO:
      allOf:
      - $ref: '#/components/schemas/PersonaBaseDTO'

    # ---------------------------------------------------------
    # SCHEMA - DETALLE DE ERROR DE CAMPO
    # ---------------------------------------------------------
    FieldErrorDTO:
      type: object
      properties:
        field:
          type: string
          example: "detalles"
        message:
          type: string
          example: "La factura debe tener al menos un producto"

    # ---------------------------------------------------------
    # SCHEMA - ERROR ESTÁNDAR
    # ---------------------------------------------------------
    ErrorResponseDTO:
      type: object
      required: [ timestamp, status, error, message, path ]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-21T18:00:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validación de formulario fallida"
        path:
          type: string
          example: "/api/v1/ajustes-stock"
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDTO'

    # ---------------------------------------------------------
    # SCHEMA - ENUMS
    # ---------------------------------------------------------
    TipoPersona:
      type: string
      enum:
        - FISICA
        - JURIDICA
      example: JURIDICA
      description: Tipo de persona (FISICA o JURIDICA)

    TipoAjuste:
      type: string
      enum:
        - POSITIVO
        - NEGATIVO
      example: POSITIVO
      description: Tipo de ajuste de stock (POSITIVO o NEGATIVO)

    EstadoFacturaVenta:
      type: string
      enum:
        - EMITIDA
        - ANULADA
      example: EMITIDA
      description: Estado de la factura de venta (EMITIDA o ANULADA)

    # ---------------------------------------------------------
    # SCHEMA - PERSONA DTO
    # (Reutilizado por Cliente, Proveedor, Empleado y Usuario)
    # ---------------------------------------------------------
    PersonaBaseDTO:
      type: object
      required: [tipoPersona, nombreCompleto]
      properties:
        tipoPersona:
          $ref: '#/components/schemas/TipoPersona'
        nombreCompleto:
          type: string
          maxLength: 150
          description: Razón Social (para Jurídica) o Nombres y Apellidos (para Física).
          example: "Distribuidora del Este S.A. o Juan Carlos Pérez"
        ci:
          type: string
          maxLength: 20
          description: Cédula de Identidad (Obligatoria si tipoPersona es FISICA)
          example: "4123456"
        ruc:
          type: string
          maxLength: 20
          description: Registro Único de Contribuyente (Obligatorio si es JURIDICA)
          example: "80012345-6"
        telefono:
          type: string
          maxLength: 30
          example: "0985123123"
        correo:
          type: string
          format: email
          maxLength: 100
          example: "juan.perez@email.com"
        direccion:
          type: string
          maxLength: 200
          example: "Avda. Eusebio Ayala 2450"

    PersonaRequestDTO:
      allOf:
        - $ref: '#/components/schemas/PersonaBaseDTO'

    PersonaResponseDTO:
      allOf:
        - $ref: '#/components/schemas/PersonaBaseDTO'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 10

    # ---------------------------------------------------------
    # SCHEMA - PROVEEDOR
    # ---------------------------------------------------------
    ProveedorRequestDTO:
      type: object
      required:
      - persona
      properties:
        nombreFantasia:
          type: string
          maxLength: 150
          example: Lácteos del Este
        estado:
          type: boolean
          default: true
        persona:
          $ref: '#/components/schemas/PersonaCreateDTO'

    ProveedorResponseDTO:
      type: object
      required:
      - idProveedor
      - estado
      - persona
      properties:
        idProveedor:
          type: integer
          format: int64
          example: 5
        nombreFantasia:
          type: string
          example: Lácteos del Este
        estado:
          type: boolean
          example: true
        persona:
          $ref: '#/components/schemas/PersonaDTO'

    ClienteRequestDTO:
      type: object
      required: [persona]
      properties:
        estado:
          type: boolean
          default: true
        persona:
          $ref: '#/components/schemas/PersonaRequestDTO'

    ClienteResponseDTO:
      type: object
      required: [idCliente, estado, persona]
      properties:
        idCliente:
          type: integer
          format: int64
          example: 12
        estado:
          type: boolean
          example: true
        persona:
          $ref: '#/components/schemas/PersonaResponseDTO'

    ClientePatchRequestDTO:
      type: object
      description: Enviar uno o ambos campos para actualizar parcialmente el cliente.
      properties:
        estado:
          type: boolean
        persona:
          $ref: '#/components/schemas/PersonaRequestDTO'

    # ---------------------------------------------------------
    # SCHEMA - EMPLEADO
    # ---------------------------------------------------------
    EmpleadoRequestDTO:
      type: object
      required: [cargo, fechaIngreso, persona]
      properties:
        cargo:
          type: string
          maxLength: 60
          example: "Depositario / Cajero"
        fechaIngreso:
          type: string
          format: date
          example: "2024-02-01"
        estado:
          type: boolean
          default: true
        persona:
          $ref: '#/components/schemas/PersonaRequestDTO'

    EmpleadoResponseDTO:
      type: object
      required: [id, cargo, fechaIngreso, estado, persona]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        cargo:
          type: string
          example: "Depositario / Cajero"
        fechaIngreso:
          type: string
          format: date
          example: "2024-02-01"
        estado:
          type: boolean
          example: true
        persona:
          $ref: '#/components/schemas/PersonaResponseDTO'

    # ---------------------------------------------------------
    # SCHEMA - COMPROBANTE Y COMPROBANTE DETALLE
    # ---------------------------------------------------------
    BaseComprobante:
      type: object
      required: [numeroFactura, fechaEmision]
      properties:
        numeroFactura:
          type: string
          maxLength: 50
          description: Formato fiscal (ej. 001-001-0001234)
          example: "001-001-0001234"
        fechaEmision:
          type: string
          format: date
          description: Fecha de emisión del comprobante
          example: "2026-09-15"

    BaseComprobanteDetalle:
      type: object
      required: [idProducto, cantidad, precioUnitario]
      properties:
        idProducto:
          type: integer
          format: int64
          example: 101
        cantidad:
          type: integer
          minimum: 1
          example: 10
        precioUnitario:
          type: number
          minimum: 0
          example: 5000.00
        porcentajeIva:
          type: number
          enum: [0, 5, 10]
          default: 10
          example: 10

    # ---------------------------------------------------------
    # SCHEMA - COMPRAS: FACTURAS (Cabecera y Detalle)
    # ---------------------------------------------------------
    FacturaCompraDetalleRequestDTO:
      allOf:
        - $ref: '#/components/schemas/BaseComprobanteDetalle'

    FacturaCompraRequestDTO:
      allOf:
        - $ref: '#/components/schemas/BaseComprobante'
        - type: object
          required: [idProveedor, idDeposito, idMedioPago, timbrado, detalles]
          properties:
            idProveedor:
              type: integer
              format: int64
              example: 5
            idDeposito:
              type: integer
              format: int64
              description: Depósito receptor del stock
              example: 1
            idMedioPago:
              type: integer
              format: int64
              example: 1
            idOrdenCompra:
              type: integer
              format: int64
              nullable: true
              description: ID de la orden de compra asociada (opcional)
              example: 10
            condicionCompra:
              type: string
              enum: [CONTADO, CREDITO]
              default: CONTADO
              example: "CONTADO"
            timbrado:
              type: string
              maxLength: 20
              description: Timbrado impreso de la factura del proveedor
              example: "15894231"
            detalles:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FacturaCompraDetalleRequestDTO'

    FacturaCompraDetalleResponseDTO:
      type: object
      required: [idDetalle, idProducto, nombreProducto, cantidad, precioUnitario, subtotal, montoIva]
      properties:
        idDetalle:
          type: integer
          format: int64
          example: 301
        idProducto:
          type: integer
          format: int64
          example: 101
        nombreProducto:
          type: string
          example: "Leche Entera 1L"
        codigoBarra:
          type: string
          example: "7840001234567"
        cantidad:
          type: integer
          example: 10
        precioUnitario:
          type: number
          example: 5000.00
        subtotal:
          type: number
          example: 50000.00
        porcentajeIva:
          type: number
          example: 10
        montoIva:
          type: number
          description: Monto de IVA liquidado incluido en el subtotal
          example: 4545.45

    FacturaCompraResponseDTO:
      allOf:
      - $ref: '#/components/schemas/BaseComprobante'
      - type: object
        required:
        - idFacturaCompra
        - activo
        - timbrado
        - totalIva
        - totalGeneral
        - estado
        - condicionCompra
        - proveedor
        - deposito
        - medioPago
        - detalles
        properties:
          idFacturaCompra:
            type: integer
            format: int64
            example: 45
          activo:
            type: boolean
            description: Indica si el comprobante está activo; se reserva para borrado lógico.
            example: true
          idOrdenCompra:
            type: integer
            format: int64
            nullable: true
            example: 10
          timbrado:
            type: string
            example: '15894231'
          estado:
            type: string
            example: ACTIVA
          condicionCompra:
            type: string
            example: CONTADO
          totalIva:
            type: number
            example: 9090.91
          totalGeneral:
            type: number
            example: 100000.0
          proveedor:
            $ref: '#/components/schemas/ProveedorResponseDTO'
          deposito:
            $ref: '#/components/schemas/DepositoDTO'
          medioPago:
            $ref: '#/components/schemas/MedioPagoDTO'
          detalles:
            type: array
            items:
              $ref: '#/components/schemas/FacturaCompraDetalleResponseDTO'

    ProveedorProductoDTO:
      type: object
      required:
        - idProveedor
        - idProducto
        - precioCostoAcordado
      properties:
        id:
          type: integer
          format: int64
          example: 1
        idProveedor:
          type: integer
          format: int64
          example: 5
        idProducto:
          type: integer
          format: int64
          example: 101
        precioCostoAcordado:
          type: number
          format: double
          example: 4800.00
        codigoProveedor:
          type: string
          example: "PROV-SKU-123"
        activo:
          type: boolean
          default: true
          example: true

    ProveedorProductoPageResponseDTO:
      allOf:
      - $ref: '#/components/schemas/ComprasPageResponse'
      - type: object
        properties:
          contenido:
            type: array
            items:
              $ref: '#/components/schemas/ProveedorProductoDTO'

    OrdenCompraDetalleDTO:
      type: object
      required:
        - idProducto
        - cantidad
        - precioUnitario
      properties:
        id:
          type: integer
          format: int64
          example: 1
        idProducto:
          type: integer
          format: int64
          example: 101
        cantidad:
          type: integer
          minimum: 1
          example: 50
        precioUnitario:
          type: number
          format: double
          example: 4800.00
        subtotal:
          type: number
          format: double
          example: 240000.00

    OrdenCompraDTO:
      type: object
      required:
        - idProveedor
        - idEmpleado
        - detalles
      properties:
        id:
          type: integer
          format: int64
          example: 10
        idProveedor:
          type: integer
          format: int64
          example: 5
        idEmpleado:
          type: integer
          format: int64
          example: 3
        estado:
          type: string
          default: "PENDIENTE"
          example: "PENDIENTE"
        observacion:
          type: string
          example: "Pedido mensual de reposición"
        total:
          type: number
          format: double
          example: 240000.00
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrdenCompraDetalleDTO'

    OrdenCompraPageResponseDTO:
      allOf:
      - $ref: '#/components/schemas/ComprasPageResponse'
      - type: object
        properties:
          contenido:
            type: array
            items:
              $ref: '#/components/schemas/OrdenCompraDTO'

    FacturaVentaDetalleRequestDTO:
      type: object
      required: [idProducto, cantidad]
      properties:
        idProducto:
          type: integer
          format: int64
          minimum: 1
          example: 101
        cantidad:
          type: integer
          minimum: 1
          example: 2

    FacturaVentaRequestDTO:
      type: object
      required: [numeroFactura, idCliente, idEmpleado, idDeposito, idMedioPago, idTimbrado, detalles]
      properties:
        numeroFactura:
          type: string
          minLength: 1
          maxLength: 50
          description: Número fiscal de la factura.
          example: "001-001-0001234"
        fechaEmision:
          type: string
          format: date
          description: Si se omite, el servicio asigna la fecha actual.
          example: "2026-09-15"
        idCliente:
          type: integer
          format: int64
          minimum: 1
          example: 12
        idEmpleado:
          type: integer
          format: int64
          minimum: 1
          example: 3
        idDeposito:
          type: integer
          format: int64
          minimum: 1
          description: Depósito desde el cual se descarga el stock vendido.
          example: 1
        idMedioPago:
          type: integer
          format: int64
          minimum: 1
          example: 1
        idTimbrado:
          type: integer
          format: int64
          minimum: 1
          description: Timbrado fiscal propio de la empresa a utilizar.
          example: 2
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FacturaVentaDetalleRequestDTO'

    FacturaVentaEstadoRequestDTO:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoFacturaVenta'

    FacturaVentaDetalleResponseDTO:
      type: object
      required: [idDetalle, idProducto, nombreProducto, cantidad, precioUnitario, subtotal, montoIva]
      properties:
        idDetalle:
          type: integer
          format: int64
          example: 801
        idProducto:
          type: integer
          format: int64
          example: 101
        nombreProducto:
          type: string
          example: "Leche Entera 1L"
        cantidad:
          type: integer
          example: 2
        precioUnitario:
          type: number
          example: 6000.00
        subtotal:
          type: number
          example: 12000.00
        porcentajeIva:
          type: number
          example: 10
        montoIva:
          type: number
          example: 1090.91

    FacturaVentaResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BaseComprobante'
        - type: object
          required: [idFacturaVenta, activo, estado, totalIva, totalGeneral, cliente, empleado, timbrado, detalles]
          properties:
            idFacturaVenta:
              type: integer
              format: int64
              example: 98
            activo:
              type: boolean
              description: Indica si el comprobante está activo; se reserva para borrado lógico.
              example: true
            estado:
              $ref: '#/components/schemas/EstadoFacturaVenta'
            totalIva:
              type: number
              example: 5454.55
            totalGeneral:
              type: number
              example: 60000.00
            cliente:
              $ref: '#/components/schemas/ClienteResponseDTO'
            empleado:
              $ref: '#/components/schemas/EmpleadoResponseDTO'
            deposito:
              $ref: '#/components/schemas/DepositoResponseDTO'
            medioPago:
              $ref: '#/components/schemas/MedioPagoDTO'
            timbrado:
              $ref: '#/components/schemas/TimbradoDTO'
            detalles:
              type: array
              items:
                $ref: '#/components/schemas/FacturaVentaDetalleResponseDTO'

    # ---------------------------------------------------------
    # SCHEMA - TIMBRADOS FISCALES
    # ---------------------------------------------------------
    TimbradoCreateDTO:
      type: object
      required: [numeroTimbrado, fechaInicio, fechaVencimiento]
      properties:
        numeroTimbrado:
          type: string
          maxLength: 20
          example: "16543210"
        fechaInicio:
          type: string
          format: date
          example: "2026-01-01"
        fechaVencimiento:
          type: string
          format: date
          example: "2026-12-31"
        sucursal:
          type: string
          maxLength: 3
          default: "001"
          example: "001"
        puntoExpedicion:
          type: string
          maxLength: 3
          default: "001"
          example: "001"
        activo:
          type: boolean
          default: true

    TimbradoDTO:
      allOf:
        - $ref: '#/components/schemas/TimbradoCreateDTO'
        - type: object
          required: [idTimbrado]
          properties:
            idTimbrado:
              type: integer
              format: int64
              example: 2

    # ---------------------------------------------------------
