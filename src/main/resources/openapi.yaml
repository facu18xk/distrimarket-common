          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaPageResponseDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    post:
      tags: [Personas]
      summary: Registrar una nueva persona
      operationId: crearPersona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaRequestDTO'
      responses:
        '201':
          description: Persona creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /personas/{idPersona}:
    get:
      tags: [Personas]
      summary: Obtener persona por ID
      operationId: obtenerPersonaPorId
      parameters:
        - name: idPersona
          in: path
          required: true
          description: ID de la persona
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Persona encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaResponseDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    put:
      tags: [Personas]
      summary: Actualizar datos de una persona
      operationId: updatePersona
      parameters:
        - name: idPersona
          in: path
          required: true
          description: ID de la persona a actualizar
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaRequestDTO'
      responses:
        '200':
          description: Persona actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    delete:
      tags: [Personas]
      summary: Eliminar persona
      operationId: deletePersona
      parameters:
        - name: idPersona
          in: path
          required: true
          description: ID de la persona a eliminar
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Persona eliminada correctamente
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # -----------------------------------------------------------
  # PATHS - EMPLEADOS
  # -----------------------------------------------------------
  /empleados:
    get:
      tags: [Empleados]
      summary: Listar todos los empleados
      operationId: listarEmpleados
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortByQuery'
        - $ref: '#/components/parameters/SortDirQuery'
      responses:
        '200':
          description: Lista de empleados obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoPageResponseDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    post:
      tags: [Empleados]
      summary: Registrar un nuevo empleado
      operationId: crearEmpleado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoRequestDTO'
      responses:
        '201':
          description: Empleado registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /empleados/{idEmpleado}:
    get:
      tags: [Empleados]
      summary: Obtener empleado por ID
      operationId: obtenerEmpleadoPorId
      parameters:
        - name: idEmpleado
          in: path
          required: true
          description: ID del empleado
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Empleado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoResponseDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    put:
      tags: [Empleados]
      summary: Actualizar datos de un empleado
      operationId: updateEmpleado
      parameters:
        - name: idEmpleado
