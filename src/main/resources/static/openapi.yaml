      type: object
      required: [ idDepositoOrigen, idDepositoDestino, idEmpleado, detalles ]
      properties:
        idDepositoOrigen:
          type: integer
          format: int64
          example: 1
          description: "ID del depósito de donde saldrá la mercadería"
        idDepositoDestino:
          type: integer
          format: int64
          example: 2
          description: "ID del depósito donde ingresará la mercadería"
        idEmpleado:
          type: integer
          format: int64
          example: 3
          description: "ID del empleado responsable de la transferencia"
        observacion:
          type: string
          maxLength: 255
          example: "Reabastecimiento de salón de ventas"
          description: "Nota aclaratoria u observación de la operación"
        detalles:
          type: array
          description: "Listado de productos y cantidades a transferir"
          items:
            $ref: '#/components/schemas/TransferenciaStockDetalleRequestDTO'

    TransferenciaStockResponseDTO:
      type: object
      required: [ id, idDepositoOrigen, nombreDepositoOrigen, idDepositoDestino, nombreDepositoDestino, idEmpleado, nombreEmpleado, estado, detalles ]
      properties:
        id:
