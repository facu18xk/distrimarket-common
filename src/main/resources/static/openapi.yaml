openapi: 3.0.3
info:
  title: DistriMarket API Gateway
  description: Contrato API y DTOs.
  version: 1.0.0
  contact:
    name: "Soporte DistriMarket"
    email: "soporte@distrimarket.com"
servers:
  - url: http://localhost:8080
    description: API Gateway Centralizado
  - url: http://localhost:8081
    description: Microservicio Inventario Local (Puerto 8081)
  - url: http://localhost:8082
    description: Microservicio Ventas Local (Puerto 8082)
  - url: http://localhost:8083
    description: Microservicio Compras Local (Puerto 8083)

# =============================================================
# 1. TAGS GLOBALES
# =============================================================
tags:
  - name: Productos
    description: Endpoints para la gestión de productos.
  - name: Ajustes-Stock
    description: Endpoints para correcciones de stock por mermas, vencimientos o sobrantes físicos.
  - name: Transferencias-Stock
    description: Movimientos de mercadería entre depósitos centrales y sucursales.
  - name: Compras-Facturas
    description: Registro de facturas de compra a proveedores con incremento automático de existencias.
  - name: Compras-Proveedores
    description: Padrón de proveedores comerciales (con Persona Jurídica o Física asociada).
  - name: Compras-Ordenes
    description: Gestión de órdenes de compra emitidas a proveedores.
  - name: Compras-Proveedores-Productos
    description: Catálogo y precios de compra acordados entre proveedores y productos.
  - name: Ventas-Facturas
    description: Emisión y anulación de comprobantes de venta con timbrado fiscal y descuento de stock.
  - name: Ventas-Clientes
    description: Registro y consulta de clientes corporativos y consumidores finales.
  - name: Ventas-Timbrados
    description: Administración de timbrados legales de la empresa, sucursales y puntos de expedición.
  - name: Personas
    description: Endpoints para la gestión de personas.
  - name: Empleados
    description: Gestión de empleados, roles de sistema y cargos en sucursales.
  - name: Administracion-General
    description: Catálogo de medios de pago, depósitos y parámetros del sistema.
  - name: Categorias
    description: Endpoints para la gestión de categorías de productos.
  - name: Marcas
    description: Endpoints para la gestión de marcas de productos.
  - name: Depositos
    description: Endpoints para la gestión de depósitos de productos.
  - name: Stocks
    description: Endpoints para la gestión de stock en los depósitos de productos.

# =============================================================
# 2. PATHS (RUTAS RESTful)
# =============================================================
paths:
  # -----------------------------------------------------------
  # PATHS - COMPRAS: FACTURAS Y PROVEEDORES
  # -----------------------------------------------------------
  /compras/facturas:
    get:
      summary: Listar facturas de compra con paginación y filtros
      tags: [Compras-Facturas]
      operationId: listarFacturasCompra
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/FilterProveedorQuery'
        - $ref: '#/components/parameters/FilterDepositoQuery'
        - $ref: '#/components/parameters/FilterFechaDesdeQuery'
        - $ref: '#/components/parameters/FilterFechaHastaQuery'
        - $ref: '#/components/parameters/FilterNumeroFacturaQuery'
      responses:
        '200':
          description: Listado paginado de facturas de compra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaCompraPageResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'

    post:
      summary: Registrar factura de compra (Cabecera y Detalle)
      description: |
        Registra una compra a proveedor.
        - Valida restricción única: (idProveedor + numeroFactura + timbrado).
        - Incrementa automáticamente el stock en el depósito receptor.
        - Calcula subtotales, total IVA y total general.
      tags: [Compras-Facturas]
      operationId: registrarFacturaCompra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaCompraRequestDTO'
      responses:
        '201':
          description: Factura de compra registrada e inventario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaCompraResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Factura ya registrada para este proveedor y timbrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                timestamp: "2026-09-17T12:00:00Z"
                status: 409
                error: "Conflict"
                message: "Ya existe una factura registrada con ese número y timbrado para el proveedor indicado"
                path: "/api/v1/compras/facturas"

  /compras/facturas/{idFacturaCompra}:
    get:
      summary: Obtener el detalle completo de una factura de compra
      tags: [Compras-Facturas]
      operationId: obtenerFacturaCompraPorId
      parameters:
        - $ref: '#/components/parameters/FacturaCompraIdPath'
      responses:
        '200':
          description: Comprobante de compra con todos sus renglones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaCompraResponseDTO'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /compras/proveedores:
    get:
      summary: Listar proveedores comerciales
      tags: [Compras-Proveedores]
      operationId: listarProveedores
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/FilterNombreQuery'
        - $ref: '#/components/parameters/FilterEstadoQuery'
      responses:
        '200':
          description: Padrón de proveedores paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorPageResponseDTO'

    post:
      summary: Registrar nuevo proveedor (Reutiliza PersonaCreateDTO)
      tags: [Compras-Proveedores]
      operationId: crearProveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProveedorRequestDTO'
      responses:
        '201':
          description: Proveedor registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /compras/proveedores/{idProveedor}:
    get:
      summary: Consultar proveedor por ID
      tags: [Compras-Proveedores]
      operationId: obtenerProveedorPorId
      parameters:
        - $ref: '#/components/parameters/ProveedorIdPath'
      responses:
        '200':
          description: Datos del proveedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorResponseDTO'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  # -----------------------------------------------------------
  # PATHS - COMPRAS: ÓRDENES DE COMPRA
  # -----------------------------------------------------------
  /compras/ordenes:
    get:
      summary: Listar órdenes de compra
      tags: [Compras-Ordenes]
      operationId: listarOrdenesCompra
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Listado paginado de órdenes de compra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraPageResponseDTO'

    post:
      summary: Crear una nueva orden de compra
      tags: [Compras-Ordenes]
      operationId: crearOrdenCompra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenCompraDTO'
      responses:
        '201':
          description: Orden de compra creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'

  /compras/ordenes/{idOrdenCompra}:
    get:
      summary: Consultar orden de compra por ID
      tags: [Compras-Ordenes]
      operationId: obtenerOrdenCompraPorId
      parameters:
        - name: idOrdenCompra
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalle de la orden de compra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCompraDTO'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  # -----------------------------------------------------------
  # PATHS - COMPRAS: CATÁLOGO PROVEEDOR-PRODUCTO
  # -----------------------------------------------------------
  /compras/proveedores-productos:
    get:
      summary: Listar acuerdos de proveedor-producto
      tags: [Compras-Proveedores-Productos]
      operationId: listarProveedoresProductos
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Listado de acuerdos proveedor-producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorProductoPageResponseDTO'

    post:
      summary: Registrar o actualizar acuerdo de compra de producto con proveedor
      tags: [Compras-Proveedores-Productos]
      operationId: crearProveedorProducto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProveedorProductoDTO'
      responses:
        '201':
          description: Acuerdo registrado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorProductoDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'

  # -----------------------------------------------------------
  # PATHS - VENTAS: FACTURAS, CLIENTES Y TIMBRADOS
  # -----------------------------------------------------------
  /ventas/facturas:
    get:
      summary: Listar facturas de venta emitidas
      tags: [Ventas-Facturas]
      operationId: listarFacturasVenta
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/FilterClienteQuery'
        - $ref: '#/components/parameters/FilterEmpleadoQuery'
        - $ref: '#/components/parameters/FilterDepositoQuery'
        - $ref: '#/components/parameters/FilterEstadoVentaQuery'
        - $ref: '#/components/parameters/FilterFechaDesdeQuery'
        - $ref: '#/components/parameters/FilterFechaHastaQuery'
      responses:
        '200':
          description: Listado paginado de facturas de venta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaPageResponseDTO'

    post:
      summary: Emitir una nueva factura de venta fiscal
      description: |
        Emite una venta formal en mostrador o distribución:
        - Valida que el timbrado esté vigente.
        - Verifica y descuenta stock disponible en el depósito de expedición.
        - Calcula subtotales, IVA según tasa de cada producto y total general.
      tags: [Ventas-Facturas]
      operationId: emitirFacturaVenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaVentaRequestDTO'
      responses:
        '201':
          description: Factura emitida exitosamente y stock descontado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          description: Regla de negocio rota (Stock insuficiente o timbrado vencido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
              example:
                timestamp: "2026-09-17T12:00:00Z"
                status: 422
                error: "Unprocessable Entity"
                message: "Stock insuficiente para 'Leche Entera 1L' en el depósito seleccionado (Disponible: 4, Solicitado: 10)"
                path: "/api/v1/ventas/facturas"

  /ventas/facturas/{idFacturaVenta}:
    get:
      summary: Obtener detalle y renglones de una factura de venta
      tags: [Ventas-Facturas]
      operationId: obtenerFacturaVentaPorId
      parameters:
        - $ref: '#/components/parameters/FacturaVentaIdPath'
      responses:
        '200':
          description: Factura de venta con sus detalles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaResponseDTO'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    patch:
      summary: Actualizar estado de factura de venta
      tags: [Ventas-Facturas]
      operationId: actualizarEstadoFacturaVenta
      parameters:
        - $ref: '#/components/parameters/FacturaVentaIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaVentaEstadoRequestDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /ventas/facturas/{idFacturaVenta}/detalles:
    get:
      summary: Listar detalles de una factura de venta
      tags: [Ventas-Facturas]
      operationId: listarDetallesFacturaVenta
      parameters:
        - $ref: '#/components/parameters/FacturaVentaIdPath'
        - name: q
          in: query
          description: Busca por nombre de producto dentro de la factura.
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Detalles paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaDetallePageResponseDTO'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    post:
      summary: Agregar detalle a la factura de venta
      tags: [Ventas-Facturas]
      operationId: agregarDetalleFacturaVenta
      parameters:
        - $ref: '#/components/parameters/FacturaVentaIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaVentaDetalleRequestDTO'
      responses:
        '201':
          description: Detalle agregado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVentaDetalleResponseDTO'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /ventas/clientes:
    get:
      summary: Listar clientes registrados
      tags: [Ventas-Clientes]
      operationId: listarClientes
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/FilterNombreQuery'
        - $ref: '#/components/parameters/FilterEstadoQuery'
      responses:
        '200':
          description: Padrón de clientes paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePageResponseDTO'

    post:
      summary: Registrar un nuevo cliente (Reutiliza PersonaCreateDTO)
      tags: [Ventas-Clientes]
      operationId: crearCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequestDTO'
      responses:
        '201':
          description: Cliente dado de alta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /ventas/clientes/{idCliente}:
    patch:
      summary: Actualizar parcialmente un cliente
      tags: [Ventas-Clientes]
      operationId: actualizarParcialmenteCliente
      parameters:
        - $ref: '#/components/parameters/ClienteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientePatchRequestDTO'
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /ventas/timbrados:
    get:
      summary: Listar timbrados fiscales de la empresa
      tags: [Ventas-Timbrados]
      operationId: listarTimbrados
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Timbrados paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimbradoPageResponseDTO'

    post:
      summary: Registrar nuevo timbrado fiscal
      tags: [Ventas-Timbrados]
      operationId: crearTimbrado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimbradoCreateDTO'
      responses:
        '201':
          description: Timbrado dado de alta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimbradoDTO'

  # -----------------------------------------------------------
  # PATHS - MEDIOS DE PAGO
  # -----------------------------------------------------------
  /medios-pago:
    get:
      summary: Listar medios de pago habilitados (Efectivo, Tarjeta, Transferencia, Cheque)
      tags: [Administracion-General]
      operationId: listarMediosPago
      responses:
        '200':
          description: Lista de medios de pago
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedioPagoDTO'

  # -----------------------------------------------------------
  # PATHS - ADMINISTRACIÓN: CONFIGURACIONES
  # -----------------------------------------------------------
  /configuraciones:
    get:
      summary: Obtener parámetros globales de configuración
      tags: [ Administracion-General ]
      operationId: listarConfiguraciones
      responses:
        '200':
          description: Lista clave-valor del sistema
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfiguracionDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # -----------------------------------------------------------
  # PATHS - CATEGORÍAS
  # -----------------------------------------------------------
  /inventario/categorias:
    get:
      tags: [ Categorias ]
      summary: Obtener lista paginada de categorías
      operationId: listarCategorias
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Lista paginada obtenida con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaPageResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    post:
      tags: [ Categorias ]
      summary: Crear una nueva categoría
      operationId: crearCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequestDTO'
      responses:
        '201':
          description: Categoría creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /inventario/categorias/{id}:
    get:
      tags: [ Categorias ]
      summary: Obtener categoría por ID
      operationId: obtenerCategoriaPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    put:
      tags: [ Categorias ]
      summary: Actualizar una categoría existente
      operationId: updateCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequestDTO'
      responses:
        '200':
          description: Categoría actualizada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    delete:
      tags: [ Categorias ]
      summary: Eliminar categoría por ID
      operationId: deleteCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Categoría eliminada con éxito
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # -----------------------------------------------------------
  # PATHS - MARCAS
  # -----------------------------------------------------------
  /inventario/marcas:
    get:
      tags: [ Marcas ]
      summary: Obtener lista paginada de marcas
      operationId: listarMarcas
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Lista paginada obtenida con éxito
          content:
            application/json:
